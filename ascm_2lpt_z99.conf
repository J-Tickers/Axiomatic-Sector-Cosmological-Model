[setup]
boxlength       = 500.0
z_start         = 99.0
levelmin        = 8
levelmin_TF     = 8
levelmax        = 8
padding         = 8
overlap         = 4
align_top       = no
baryons         = no
use_2LPT        = yes
use_LLA         = no
periodic_TF     = yes

[cosmology]
Omega_m         = 0.299
Omega_L         = 0.701
Omega_b         = 0.049
H0              = 67.4
sigma_8         = 0.811
ns              = 0.965
YHe             = 0.245

[transfer]
transfer        = file
transfer_file   = ascm_transfer_z99.dat